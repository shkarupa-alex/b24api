[build-system]
requires = [
    "setuptools>=80.9.0",
    "setuptools-git-versioning>=2.1.0",
    "wheel>=0.45.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[project]
name = "b24api"
dynamic = ["version"]
description = "Bitrix24 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioitertools>=0.12.0",
    "fast-depends>=2.4.12",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "tenacity>=9.1.2",
]

[tool.setuptools.package-data]
b24api = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["b24api*"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest-asyncio>=1.1.0",
    "pytest-env>=1.1.5",
    "pytest-httpx>=0.35.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.15.5",
    "setuptools>=80.9.0",
    "setuptools-git-versioning>=2.1.0",
    "wheel>=0.45.1",
]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["EM", "TRY003", "D1", "FA"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
no-lines-before = ["standard-library"]
known-third-party = []

[tool.ruff.lint.extend-per-file-ignores]
"*_test.py" = ["S101", "S311"]


[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "h2.*",
    "aioitertools.*",
    "fast_depends.*",
    "tenacity.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["b24api.api_test", "b24api.query_test"]
disable_error_code = [
    "call-arg",       # @inject hides DI-resolved arguments from mypy
    "arg-type",       # test code operates on ApiTypes without narrowing
    "assignment",     # variable reuse with different types in test helpers
    "call-overload",  # indexing ApiTypes with str
    "index",          # indexing ApiTypes with str
    "misc",           # yield type in async generators
    "operator",       # comparison on dynamic types
    "return-value",   # sorted key returning dynamic types
    "type-arg",       # unparameterized dict in test helpers
]


[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true

[tool.pytest_env]
BITRIX24_API_WEBHOOK_URL = "https://bitrix24.com/rest/0/test/"
BITRIX24_API_RETRY_DELAY = "0.01"
BITRIX24_API_RETRY_BACKOFF = "1"


[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
