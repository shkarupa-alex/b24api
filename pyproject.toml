[build-system]
requires = [
    "setuptools>=80.9.0",
    "setuptools-git-versioning>=2.1.0",
    "wheel>=0.45.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[project]
name = "b24api"
dynamic = ["version"]
description = "Bitrix24 API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shkarupa Alex", email = "shkarupa.alex@gmail.com" }]
keywords = ["bitrix24", "rest", "api", "client", "async", "httpx", "batch", "pagination"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx[http2]>=0.28.1,<0.29",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.10.1",
]

[project.urls]
Homepage = "https://github.com/shkarupa-alex/b24api"
Repository = "https://github.com/shkarupa-alex/b24api"
Issues = "https://github.com/shkarupa-alex/b24api/issues"
Changelog = "https://github.com/shkarupa-alex/b24api/blob/master/CHANGELOG.md"

[project.scripts]
b24api = "b24api.cli:main"

[tool.setuptools.packages.find]
include = ["b24api*"]

[tool.setuptools.package-data]
b24api = ["py.typed"]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "jsonschema>=4.25.1",
    "mypy>=1.15.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.1.5",
    "pytest-httpx>=0.35.0",
    "pytest-mock>=3.14.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.5",
    "setuptools>=80.9.0",
    "setuptools-git-versioning>=2.1.0",
    "types-jsonschema>=4.26.0.20260113",
    "types-pyyaml>=6.0.12.20260906",
    "wheel>=0.45.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "EM", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
no-lines-before = ["standard-library"]
known-third-party = []

[tool.ruff.lint.extend-per-file-ignores]
"*_test.py" = [
    "D100",
    "D103",
    "S101",
    "S311",
]
"tests/golden/*.py" = ["S101"]


[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "h2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.pytest_env]
BITRIX24_API_WEBHOOK_URL = "https://bitrix24.com/rest/0/test/"


[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
