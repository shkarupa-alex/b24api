name: Publish to PyPI

# Every pushed tag runs this workflow, but only a canonical stable release tag MAJOR.MINOR.PATCH
# (for example 2.2.1, with no prefix or suffix) on a commit of master may build and publish. The tag
# is checked first, then the full blocking CI runs on the tagged commit, then the distributions are
# built by the locked build backend and checked against the tag. setuptools-git-versioning derives
# the package version from that tag.

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the gate can tell whether the tagged commit is on master.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release tag
        # GITHUB_REF_NAME is read from the environment, never interpolated into the script.
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          python .github/scripts/verify_release.py tag

  ci:
    # The full blocking CI (ci.yml, aggregate check `ci`) must pass on the tagged SHA.
    needs:
      - release-tag
    uses: ./.github/workflows/ci.yml

  release-build:
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          python-version: "3.12"

      - name: Build release distributions
        # Without build isolation the backend comes from the locked `build` group, not the newest release.
        run: |
          uv sync --locked --only-group build --no-install-project
          uv build --no-build-isolation --no-create-gitignore --out-dir dist

      - name: Verify release distributions
        run: uv run --no-project python .github/scripts/verify_release.py dists dist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/b24api

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
