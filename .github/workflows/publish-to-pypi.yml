name: Publish to PyPI

# Every pushed tag runs this workflow, but only a canonical stable release tag MAJOR.MINOR.PATCH
# (for example 2.2.1, with no prefix or suffix) may build and publish. setuptools-git-versioning
# derives the package version from that tag; the build job verifies the distributions against it.

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  ci:
    # The full blocking CI (ci.yml, aggregate check `ci`) must pass on the tagged SHA first.
    uses: ./.github/workflows/ci.yml

  release-build:
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release tag
        # GITHUB_REF_NAME is read from the environment, never interpolated into the script.
        run: python .github/scripts/verify_release.py tag

      - name: Build release distributions
        run: |
          python -m pip install build twine
          python -m build

      - name: Verify release distributions
        run: |
          python .github/scripts/verify_release.py dists dist
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/b24api

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
